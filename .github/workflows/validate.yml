name: Validate Demo Extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check extension/files/client/custom/modules/v1-modern-dashboard/src/views/dashlets/overview.js
      - uses: actions/upload-artifact@v4
        with:
          name: v1-modern-dashboard-0.1.0
          path: dist/v1-modern-dashboard-0.1.0.zip
          if-no-files-found: error
